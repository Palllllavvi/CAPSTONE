server:
  port: 8085

spring:
  application:
    name: claim-service
  datasource:
    url: jdbc:h2:mem:secure360_claim_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

app:
  jwt:
    secret: Secure360SuperSecretKeyForJwtAuthenticationFreelancerProtectionPlatform2026!
    expiration-ms: 86400000
